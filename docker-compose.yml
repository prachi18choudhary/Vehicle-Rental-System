services:
  mysql:
    image: mysql:8.0
    container_name: vrs-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_DATABASE: vrs
    ports:
      - "33306:3306"   # host:container — host is 33306 to avoid conflict with local MySQL
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management
    container_name: vrs-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"     # AMQP
      - "15672:15672"   # management UI
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  eureka-server:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        SERVICE: eureka-server
    container_name: vrs-eureka
    ports:
      - "8761:8761"

  api-gateway:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        SERVICE: api-gateway
    container_name: vrs-gateway
    depends_on:
      - eureka-server
    environment:
      EUREKA_URL: http://eureka-server:8761/eureka/
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-very-long-random-string-32-chars-min}
      JWT_ISSUER: vrs-auth
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost
    ports:
      - "8080:8080"

  auth-service:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        SERVICE: auth-service
    container_name: vrs-auth
    depends_on:
      mysql: { condition: service_healthy }
      eureka-server: { condition: service_started }
    environment:
      EUREKA_URL: http://eureka-server:8761/eureka/
      DB_URL: jdbc:mysql://mysql:3306/auth_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:-root}
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-very-long-random-string-32-chars-min}
      JWT_ISSUER: vrs-auth
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@vrs.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin@123}
    ports:
      - "8081:8081"

  vehicle-service:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        SERVICE: vehicle-service
    container_name: vrs-vehicle
    depends_on:
      mysql: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      eureka-server: { condition: service_started }
    environment:
      EUREKA_URL: http://eureka-server:8761/eureka/
      DB_URL: jdbc:mysql://mysql:3306/vehicle_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:-root}
      RABBITMQ_HOST: rabbitmq
    ports:
      - "8082:8082"

  booking-service:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        SERVICE: booking-service
    container_name: vrs-booking
    depends_on:
      mysql: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      eureka-server: { condition: service_started }
    environment:
      EUREKA_URL: http://eureka-server:8761/eureka/
      DB_URL: jdbc:mysql://mysql:3306/booking_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:-root}
      RABBITMQ_HOST: rabbitmq
    ports:
      - "8083:8083"

  payment-service:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        SERVICE: payment-service
    container_name: vrs-payment
    depends_on:
      mysql: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      eureka-server: { condition: service_started }
    environment:
      EUREKA_URL: http://eureka-server:8761/eureka/
      DB_URL: jdbc:mysql://mysql:3306/payment_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:-root}
      RABBITMQ_HOST: rabbitmq
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-rzp_test_dummy}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-dummysecret}
    ports:
      - "8084:8084"

  notification-service:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        SERVICE: notification-service
    container_name: vrs-notification
    depends_on:
      mysql: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      eureka-server: { condition: service_started }
    environment:
      EUREKA_URL: http://eureka-server:8761/eureka/
      DB_URL: jdbc:mysql://mysql:3306/notification_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:-root}
      RABBITMQ_HOST: rabbitmq
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-your.email@gmail.com}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-app-password}
      MAIL_FROM: ${MAIL_FROM:-no-reply@vrs.com}
      MAIL_ENABLED: ${MAIL_ENABLED:-false}
    ports:
      - "8085:8085"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vrs-frontend
    depends_on:
      - api-gateway
      - notification-service
    ports:
      - "5173:80"

volumes:
  mysql_data:
