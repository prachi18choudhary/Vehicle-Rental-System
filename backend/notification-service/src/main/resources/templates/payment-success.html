<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Payment Successful</title></head>
<body style="font-family: Arial, sans-serif; background:#f5f7fb; padding:24px;">
  <div style="max-width:560px; margin:0 auto; background:#fff; border-radius:12px; padding:32px; box-shadow:0 4px 16px rgba(0,0,0,.06);">
    <h2 style="color:#10b981; margin-top:0;">Payment Receipt</h2>
    <p>Thank you! Your payment has been received successfully.</p>

    <table style="width:100%; border-collapse:collapse; margin-top:16px;">
      <tr><td style="padding:6px 0;color:#6b7280;">Payment ID</td><td style="padding:6px 0;" th:text="${paymentId}"></td></tr>
      <tr><td style="padding:6px 0;color:#6b7280;">Razorpay ID</td><td style="padding:6px 0;" th:text="${razorpayPaymentId}"></td></tr>
      <tr><td style="padding:6px 0;color:#6b7280;">Booking</td><td style="padding:6px 0;">#<span th:text="${bookingId}"></span></td></tr>
      <tr><td style="padding:6px 0;color:#6b7280;">Amount</td><td style="padding:6px 0;font-weight:bold;color:#10b981;">&#8377; <span th:text="${amount}"></span></td></tr>
    </table>

    <p style="margin-top:24px;">A booking confirmation will follow with your pickup details.</p>
    <p style="color:#6b7280; font-size:12px; margin-top:32px;">Vehicle Rental System &middot; This is an automated email.</p>
  </div>
</body>
</html>
