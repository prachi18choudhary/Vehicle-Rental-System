<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Payment Failed</title></head>
<body style="font-family: Arial, sans-serif; background:#f5f7fb; padding:24px;">
  <div style="max-width:560px; margin:0 auto; background:#fff; border-radius:12px; padding:32px; box-shadow:0 4px 16px rgba(0,0,0,.06);">
    <h2 style="color:#ef4444; margin-top:0;">Payment Failed</h2>
    <p>Unfortunately, your payment for booking <strong>#<span th:text="${bookingId}"></span></strong> could not be processed.</p>

    <p>Amount attempted: <strong>&#8377; <span th:text="${amount}"></span></strong></p>

    <p>Please retry the payment from your bookings page. If the problem persists, contact support.</p>
    <p style="color:#6b7280; font-size:12px; margin-top:32px;">Vehicle Rental System &middot; This is an automated email.</p>
  </div>
</body>
</html>
