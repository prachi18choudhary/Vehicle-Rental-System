<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Booking Confirmed</title></head>
<body style="font-family: Arial, sans-serif; background:#f5f7fb; padding:24px;">
  <div style="max-width:560px; margin:0 auto; background:#fff; border-radius:12px; padding:32px; box-shadow:0 4px 16px rgba(0,0,0,.06);">
    <h2 style="color:#10b981; margin-top:0;">Booking Confirmed</h2>
    <p>Great news! Your booking is confirmed.</p>

    <div style="background:#ecfdf5; border:1px solid #a7f3d0; border-radius:8px; padding:16px; margin:16px 0;">
      <p style="margin:0;"><strong>Vehicle:</strong> <span th:text="${vehicleName}"></span></p>
      <p style="margin:6px 0 0 0;"><strong>Booking ID:</strong> #<span th:text="${bookingId}"></span></p>
    </div>

    <h3 style="color:#1f2937;">Pickup &amp; Drop-off</h3>
    <table style="width:100%; border-collapse:collapse;">
      <tr><td style="padding:6px 0;color:#6b7280;">Pickup at</td><td style="padding:6px 0;" th:text="${pickupAt}"></td></tr>
      <tr><td style="padding:6px 0;color:#6b7280;">Pickup location</td><td style="padding:6px 0;" th:text="${pickupLocation}"></td></tr>
      <tr><td style="padding:6px 0;color:#6b7280;">Drop-off at</td><td style="padding:6px 0;" th:text="${dropoffAt}"></td></tr>
      <tr><td style="padding:6px 0;color:#6b7280;">Drop-off location</td><td style="padding:6px 0;" th:text="${dropoffLocation}"></td></tr>
    </table>

    <p style="margin-top:24px;">Please arrive on time and bring a valid ID and driving license. Have a safe journey!</p>
    <p style="color:#6b7280; font-size:12px; margin-top:32px;">Vehicle Rental System &middot; This is an automated email.</p>
  </div>
</body>
</html>
